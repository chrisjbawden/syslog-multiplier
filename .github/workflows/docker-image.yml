name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'build/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'build/**'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      
    - name: Build and push docker image
      run: |
        TIMESTAMP=$(date +%Y%m%d%H%M)
        docker build ./build --file ./build/Dockerfile --tag chrisjbawden/syslog-multiplier:$TIMESTAMP --tag chrisjbawden/syslog-multiplier:latest
        docker push chrisjbawden/syslog-multiplier:$TIMESTAMP
        docker push chrisjbawden/syslog-multiplier:latest
