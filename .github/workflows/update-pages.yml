name: Deploy Docs to the repo's github-pages

on:
  # Re‑publish whenever anything in docs/ changes on main
  push:
    branches: [ "main" ]
    paths:     [ "docs/**" ]

  # Manual “Run workflow” button
  workflow_dispatch: {}

jobs:
  deploy-docs:
    # Required permissions for the Pages actions
    permissions:
      contents: read      # fetch source
      pages: write        # push artefact to Pages
      id-token: write     # auth for deployment

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 1 – Check out the repo
      - uses: actions/checkout@v4

      # 2 – Configure Pages (sets up the deployment target)
      - uses: actions/configure-pages@v4

      # 3 – Package & upload the docs folder
      - name: Upload docs artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs        # ← static site root

      # 4 – Deploy to GitHub Pages
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
