name: Deploy Docs to the repo's github-pages

on:
  # Automatic rebuild whenever anything under docs/ is modified on main
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'

  workflow_dispatch: {}

jobs:
  deploy-pages:
    # The built‑in Pages actions require these explicit permissions
    permissions:
      contents: read        # to fetch the source
      pages: write          # to push the artefact to Pages
      id-token: write       # to authenticate to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Check out repository
      - uses: actions/checkout@v4

      # 2. Set up the Pages deployment environment
      - uses: actions/configure-pages@v3

      # 3. Upload the docs/ folder as a Pages artefact
      - name: Upload docs folder
        uses: actions/upload-pages-artifact@v2
        with:
          path: docs    # ← static content source (HTML, CSS, etc.)

      # 4. Publish it
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
