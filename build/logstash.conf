input {
  syslog {
    port => 514
    host => "0.0.0.0" 
  }
}

output {
  # First syslog output with multiple workers
  syslog {
    host => "192.168.0.40"  # Replace with the IP or hostname of the first syslog server
    port => 512
    protocol => "udp" 
  }

  # Second syslog output with multiple workers
  syslog {
    host => "syslog-server-2.local"  # Replace with the IP or hostname of the second syslog server
    port => 514
    protocol => "udp" 
  }
}

output {
  stdout { codec => rubydebug }
}
